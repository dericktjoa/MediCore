services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicore-app
    environment:
      MONGO_URI: mongodb://mongodb:27017/medicore
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: medicore-mongodb
    environment:
      MONGO_INITDB_DATABASE: medicore
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  os:
    image: ubuntu:22.04
    container_name: medicore-os
    command: ["sleep", "infinity"]
    restart: unless-stopped

volumes:
  mongodb-data:
